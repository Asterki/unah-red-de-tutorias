site_name: Red de Tutores UNAH
site_description: Developer and operator documentation for the template.
docs_dir: docs
exclude_docs: |
  archive/
theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - content.code.copy
    - content.tabs.link
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
nav:
  - Home: index.md
  - Architecture: architecture.md
  - Configuration: configuration.md
  - Database: database.md
  - Roles and permissions: rbac.md
  - API: api.md
  - Deployment: deployment.md
  - Observability: observability.md
  - Testing: testing.md
  - Contributing: contributing.md
  - Using the template: template-usage.md
  - Example module: example-module.md
  - Upgrading: upgrading.md
  - Operator pages:
      - Overview: in-app/index.md
      - Database switching: in-app/database.md
      - Roles: in-app/rbac.md
      - Deployment: in-app/deployment.md
  - Decisions:
      - Package layout: decisions/0001-package-layout.md
      - Shared build: decisions/0002-shared-build-prisma-types.md
      - Typecheck drift: decisions/0003-p0-typecheck-drift.md
      - Prisma CLI working directory: decisions/0004-prisma-cli-working-directory.md
      - Planning documents archive: decisions/0005-planning-documents-archive.md
