name: unah-red-tutores-ghcr

services:
  mariadb:
    image: mariadb:11.4
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    volumes:
      - unah-red-tutores-unah-red-tutores-mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  migrate:
    image: ghcr.io/${GHCR_OWNER}/${IMAGE_NAME}:${IMAGE_TAG:-latest}
    command:
      - sh
      - -c
      - ./node_modules/.bin/prisma migrate deploy && node dist/cli/seed.js
    restart: "no"
    env_file:
      - path: .env
        required: false
    depends_on:
      mariadb:
        condition: service_healthy

  api:
    image: ghcr.io/${GHCR_OWNER}/${IMAGE_NAME}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    init: true
    env_file:
      - path: .env
        required: false
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${PORT:-3000}:${PORT:-3000}"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'wget -qO- "http://127.0.0.1:$${PORT:-3000}/readyz" || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  unah-red-tutores-unah-red-tutores-mariadb-data:
