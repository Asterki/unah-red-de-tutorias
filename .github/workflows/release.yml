name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish for a manual release"
        required: false
        type: string

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release please
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  image:
    name: Build, scan and publish image
    needs: release-please
    # On push the image job waits for release-please. A manual dispatch skips
    # release-please and builds the tag supplied in the workflow input.
    if: >-
      always() &&
      (github.event_name == 'workflow_dispatch' ||
      needs.release-please.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      RELEASE_CREATED: ${{ needs.release-please.outputs.release_created || 'false' }}
      RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image name and tags
        id: image
        env:
          IMAGE_NAME: ${{ github.event.repository.name }}
          MANUAL_TAG: ${{ github.event.inputs.tag }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME,,}"
          echo "name=${image}" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<EOF"
            echo "type=edge,branch=main"
            echo "type=sha"
            if [ -n "${MANUAL_TAG}" ]; then
              echo "type=raw,value=${MANUAL_TAG}"
            fi
            if [ "${RELEASE_CREATED}" = "true" ]; then
              echo "type=semver,pattern={{version}},value=${RELEASE_TAG}"
              echo "type=semver,pattern={{major}}.{{minor}},value=${RELEASE_TAG}"
              echo "type=raw,value=latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.title=unah-red-tutores-api
            org.opencontainers.image.description=Headless Express API template
            org.opencontainers.image.vendor=Asterki

      - name: Build local image for scanning
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ${{ steps.image.outputs.name }}:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image for fixed HIGH and CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: ${{ steps.image.outputs.name }}:scan
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
